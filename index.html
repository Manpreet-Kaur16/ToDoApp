<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDoApp</title>
    <link href="style.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body
    class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen font-sans"
  >
    <div class="container mx-auto px-4 py-8 max-w-4xl">
      <header class="text-center mb-8">
        <h1 class="text-4xl font-bold text-gray-800 mb-2">ToDo App</h1>
        <p class="text-gray-600">Organize your tasks efficiently</p>
      </header>
      <main>
        <section class="bg-white rounded-lg shadow-lg p-6 mb-6">
          <div class="flex flex-col md:flex-row gap-4 items-end">
            <div class="flex-1">
              <label
                for="inputField"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Add New Task</label
              >
              <input
                id="inputField"
                type="text"
                placeholder="Enter your task here..."
                name="title"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
              />
              <span
                id="errorMessage"
                class="text-red-500 text-sm mt-1 block"
                style="display: none"
                >This field is required</span
              >
            </div>
            <div class="flex gap-2">
              <button
                id="addbtn"
                class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg transition duration-200 font-medium"
              >
                Add Task
              </button>
              <button
                id="clearbtn"
                class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-lg transition duration-200 font-medium"
              >
                Clear All
              </button>
            </div>
          </div>
        </section>
        <section class="bg-white rounded-lg shadow-lg p-6 mb-6">
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div>
              <h3 class="text-lg font-semibold text-gray-800 mb-4">
                Filter Tasks
              </h3>
              <div class="space-y-3">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2"
                    >Quick Filter</label
                  >
                  <select
                    class="status w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                  >
                    <option value="all">All Tasks</option>
                    <option value="complete">Completed</option>
                    <option value="incomplete">Incomplete</option>
                  </select>
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2"
                    >Detailed Filter</label
                  >
                  <div class="flex gap-4">
                    <div class="flex items-center">
                      <input
                        id="all"
                        value="all"
                        type="radio"
                        name="status"
                        class="mr-2"
                      />
                      <label for="all" class="text-sm">All</label>
                    </div>
                    <div class="flex items-center">
                      <input
                        id="complete"
                        value="complete"
                        type="radio"
                        name="status"
                        class="mr-2"
                      />
                      <label for="complete" class="text-sm">Completed</label>
                    </div>
                    <div class="flex items-center">
                      <input
                        id="incomplete"
                        value="incomplete"
                        type="radio"
                        name="status"
                        class="mr-2"
                      />
                      <label for="incomplete" class="text-sm">Incomplete</label>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div>
              <h3 class="text-lg font-semibold text-gray-800 mb-4">
                Sort & Search
              </h3>
              <div class="space-y-3">
                <div>
                  <label
                    for="sortBy"
                    class="block text-sm font-medium text-gray-700 mb-2"
                    >Sort By</label
                  >
                  <select
                    id="sortBy"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                  >
                    <option value="">Sort By</option>
                    <option value="sortA-Z">A-Z</option>
                    <option value="sortID">ID</option>
                  </select>
                </div>
                <div>
                  <label
                    for="userInput"
                    class="block text-sm font-medium text-gray-700 mb-2"
                    >Search Tasks</label
                  >
                  <div class="flex gap-2">
                    <input
                      id="userInput"
                      type="text"
                      placeholder="Search tasks..."
                      class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    />
                    <button
                      id="clearSearch"
                      class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-md transition duration-200"
                    >
                      Clear
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
        <section id="toDoContainer" class="space-y-4"></section>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
