<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDoApp</title>
    <link href="style.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-gray-100">
    <div class="flex flex-col items-center w-[400] h-[400] mt-4">
      <h1 class="font-bold text-xl">ToDoApp</h1>
      <div class="space-y-6 mt-6">
        <span
          id="errorMessage"
          class="text-red-700 font-bold"
          style="display: none"
          >this field is required</span
        >
        <input
          id="inputField"
          type="text"
          placeholder="input"
          name="title"
          class="border border-gray-300 px-2 py-1"
        />

        <button id="addbtn" class="bg-blue-700 text-white px-4 py-1 rounded">
          Create
        </button>
        <button id="clearbtn" class="bg-blue-700 text-white px-4 py-1 rounded">
          Clear All
        </button>
      </div>
    </div>
    <div
      class="flex mx-auto justify-end items-center max-w-[640px] bg-white border border-gray-300 p-4 mb-2"
    >
      <select class="status">
        <option value="all">All</option>
        <option value="complete">Completed</option>
        <option value="incomplete">Incomplete</option>
      </select>

      <div
        class="flex border items-center mx-auto p-4 mb-2 max-w-[640px] gap-4"
      >
        <div>
          <label for="all">All</label>
          <input
            id="all"
            value="all"
            type="radio"
            name="status"
            class="px-2 py-1 p-4 border-gray-300"
          />
        </div>
        <div>
          <label for="complete">complete</label>

          <input id="complete" value="complete" type="radio" name="status" />
        </div>
        <div>
          <label for="incomplete">Incomplete</label>
          <input
            id="incomplete"
            value="incomplete"
            type="radio"
            name="status"
          />
        </div>
        <div
          class="flex border items-center mx-auto p-4 mb-2 max-w-[640px] gap-4"
        >
          <select id="sortBy">
            <option value="">Sort-By</option>
            <option value="sortA-Z">Sort A-Z</option>
            <option value="sortID">Sort by ID</option>
          </select>
        </div>
        <div class="flex items-center max-w-[640px] mx-auto gap-4">
          <input
            id="userInput"
            type="text"
            placeholder="Search"
            class="items-center border border-gray-300 border-gray-500 w-full p-4 bg-white mx-auto"
          />

          <button
            id="clearSearch"
            class="border bg-gray-300 text-red-800 font-bold px-2 py-1 p-4"
          >
            X
          </button>
        </div>
      </div>
    </div>

    <div
      id="toDoContainer"
      class="border border-dashed border-gray-500 w-[640px] p-4 bg-white mx-auto"
    ></div>

    <script src="script.js"></script>
  </body>
</html>
