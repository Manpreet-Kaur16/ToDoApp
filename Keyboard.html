<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KeboardEvents</title>
  </head>
  <body>
    <input
      type="text"
      id="myInput"
      placeholder="Type something and press Enter"
    />
    <script>
      let inputFielsElements = document.getElementById("myInput");
      inputFielsElements.addEventListener("keypress", (event) => {
        if (event.key == "Enter") {
          console.log(inputFielsElements.value);
        }
      });
    </script>
  </body>
</html>
